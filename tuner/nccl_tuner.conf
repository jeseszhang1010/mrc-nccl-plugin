# NCCL Tuner Configuration File
# Format: collective_type,min_bytes,max_bytes,algorithm,protocol,channels,nNodes,nRanks,numPipeOps,regBuff
#
# Collective types: broadcast, reduce, allgather, reducescatter, allreduce
# Algorithms: tree, ring, collnet_direct, collnet_chain, nvls, nvls_tree, pat
# Protocols: ll, ll128, simple
# Channels: number of channels to use, or -1 to keep default
# nNodes: number of nodes to match, or -1 for any number of nodes
# nRanks: number of ranks to match, or -1 for any number of ranks
# numPipeOps: number of pipeline operations to match, or -1 for any (optional)
# regBuff: whether user buffer can be registered (0=no, 1=yes, -1=any) (optional)
#
# Lines starting with '#' are comments.  The first matching rule wins, and a
# matching rule takes priority over the cost model.
#
# This file ships with no active rules.  Add rules measured on your own
# deployment, then check them with test/csv_tuning_main.
#
# Note: on GB200F with MNNVL, NCCL treats an entire NVLink domain as a single
# 'node', so (nNodes, nRanks) are the values NCCL reports, not physical counts.
# With 16 physical nodes (4 GPUs each) per NVL domain:
#   nNodes = max(1, ceil(physical_nodes / 16))
#   nRanks = physical_nodes * 4
# With NCCL_MNNVL_ENABLE=0, nNodes is the physical node count.
#
# Examples (uncomment and adjust):
# allreduce,1048577,4294967295,ring,simple,4,4,-1
# allreduce,4096,2097152,ring,ll,-1,1,8
